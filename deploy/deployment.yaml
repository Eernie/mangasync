apiVersion: apps/v1
kind: Deployment
metadata:
  name: mangasync
  labels:
    app.kubernetes.io/name: mangasync
spec:
  replicas: 1 # SQLite + SSE: exactly one instance
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mangasync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mangasync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mangasync
          image: mangasync
          envFrom:
            - configMapRef:
                name: mangasync
            - secretRef:
                name: mangasync
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mangasync-data
        - name: tmp
          emptyDir: {}
